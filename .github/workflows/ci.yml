---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check every target at the minimum supported Rust version
        run: cargo check --all-targets --all-features --locked

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install optional media tooling on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg jq

      - name: Install optional media tooling on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg jq

      - name: Verify JSON Schema syntax
        run: |
          for schema in schemas/*.schema.json; do
            jq empty "$schema"
          done

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify extension examples and generated reference
        run: |
          python3 scripts/generate-extension-docs.py --check
          generated_manifest="$(mktemp)"
          generated_embedded_manifest="$(mktemp)"
          trap 'rm -f "${generated_manifest}" "${generated_embedded_manifest}"' EXIT
          cargo run --quiet --locked --example process_extension -- --print-manifest > "${generated_manifest}"
          diff --unified examples/extensions/reference-inspector.manifest.json "${generated_manifest}"
          cargo run --quiet --locked --example embedded_roles -- --print-manifest > "${generated_embedded_manifest}"
          diff --unified examples/extensions/reference-embedded-roles.manifest.json "${generated_embedded_manifest}"

      - name: Run synthetic end-to-end test
        run: ./scripts/smoke-test.sh

  performance:
    name: Read-only performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test performance sampling policy
        run: python3 -m unittest tests/test_performance_baseline.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the optimized binary
        run: cargo build --locked --release

      - name: Enforce performance budgets
        run: |
          python3 scripts/run-performance-baseline.py \
            --binary "target/release/optiflow" \
            --budgets "performance/budgets-v1.json" \
            --output "target/performance-baseline.json" \
            --enforce

      - name: Retain performance evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optiflow-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/performance-baseline.json
          if-no-files-found: warn
          retention-days: 30
