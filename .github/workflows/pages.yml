---
name: Publish site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}"
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.FLOW_SUITE_HOSTED_CI == 'enabled') && (github.event_name != 'schedule' || vars.FLOW_SUITE_SCHEDULED_CI == 'enabled')
    name: Compose Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
      actions: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - name: Check out complete repository history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture public Work, Health and Releases sources
        id: public_sources
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # Exact reviewed Relay production source integration.
        uses: egohygiene/relay/actions/repository-intelligence-github-sources@99a08a75bf914a80ce966c9bc9b47a77c7e97d63
        with:
          github-token: "${{ github.token }}"
          include-titles: "true"

      - name: Retain exact same-run source captures
        id: source_capture_upload
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # Ordinary immutable capture artifact, separate from the Pages artifact.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ steps.public_sources.outputs.artifact-name }}"
          path: "${{ steps.public_sources.outputs.artifact-directory }}"
          if-no-files-found: error
          retention-days: 7

      - name: Retain bounded public source producer receipt
        if: ${{ !cancelled() && steps.public_sources.outputs.producer-receipt != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "optiflow-intelligence-source-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ steps.public_sources.outputs.producer-receipt }}"
          if-no-files-found: error
          retention-days: 7

      - name: Generate public repository intelligence
        # Reviewed Relay source candidate; native/consumer qualification remains deferred.
        uses: egohygiene/relay/actions/repository-intelligence@99a08a75bf914a80ce966c9bc9b47a77c7e97d63
        with:
          collect-journey: "true"
          search-attribution: "true"
          source-capture-artifact-id: "${{ steps.source_capture_upload.outputs.artifact-id }}"
          source-capture-artifact-digest: "${{ steps.source_capture_upload.outputs.artifact-digest }}"
          as-of: "${{ steps.public_sources.outputs.as-of }}"
          collect-dependencies: "${{ steps.source_capture_upload.outputs.artifact-id != '' }}"
          output-directory: ".site/producers/intelligence"
          work-directory: ".cache/repository-intelligence"
          reports-directory: ".reports"
          excluded-paths: >-
            .git,.staging,.cache,.venv,.site,docs/generated,node_modules,
            vendor,dist,build,coverage,__pycache__,target
          analytics-excluded-paths: >-
            .git,.staging,.cache,.venv,.site,.tox,.mypy_cache,.ruff_cache,
            .reports,docs/generated,node_modules,vendor,dist,build,coverage,
            __pycache__,target
          activity-since: "1 year ago"
          max-depth: "10"
          require-full-history: "true"

      - name: Install uv
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version: "0.11.33"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize documentation dependencies
        run: uv sync --frozen --only-group docs

      - name: Compose and verify complete static site
        env:
          INTELLIGENCE_SOURCE: ".site/producers/intelligence"
        run: ./scripts/site/build.sh

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload reviewable GitHub Pages artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: "dist"
          retention-days: "7"

  deploy:
    name: Deploy public site
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.FLOW_SUITE_HOSTED_CI == 'enabled') && (github.event_name != 'schedule' || vars.FLOW_SUITE_SCHEDULED_CI == 'enabled') && (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
