---
name: Documentation

on:
  pull_request:
    paths:
      - "examples/**"
      - "tests/test_site_examples.py"
      - ".github/workflows/docs.yml"
      - "*.md"
      - "docs/**"
      - "pyproject.toml"
      - "schemas/**"
      - "scripts/site/**"
      - "uv.lock"
      - "web/landing/**"
      - "web/architecture/**"
      - "zensical.toml"
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "tests/test_site_examples.py"
      - ".github/workflows/docs.yml"
      - "*.md"
      - "docs/**"
      - "pyproject.toml"
      - "schemas/**"
      - "scripts/site/**"
      - "uv.lock"
      - "web/landing/**"
      - "web/architecture/**"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.FLOW_SUITE_HOSTED_CI == 'enabled') && (github.event_name != 'schedule' || vars.FLOW_SUITE_SCHEDULED_CI == 'enabled')
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          version: "0.11.33"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize documentation dependencies
        run: uv sync --frozen --only-group docs

      - name: Test public example composition regressions
        run: python3 -B -m unittest discover --start-directory tests --pattern test_site_examples.py

      - name: Compose and verify static site
        run: ./scripts/site/build.sh
