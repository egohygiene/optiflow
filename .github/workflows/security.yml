---
name: Security and dependency policy

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: Licenses, advisories, bans, and sources (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - "Cargo.toml"
          - "fuzz/Cargo.toml"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce Cargo dependency policy
        # EmbarkStudios/cargo-deny-action v2.1.1
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories bans licenses sources
          arguments: "--all-features"
          manifest-path: "${{ matrix.manifest }}"

  dependency-review:
    name: Pull-request supply-chain review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Review dependency changes
        # actions/dependency-review-action v4.9.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development

  secret-scan:
    name: Verified and unknown secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out complete comparison history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan changed history for secrets
        # trufflesecurity/trufflehog v3.97.4
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          version: "3.97.4"
          extra_args: "--results=verified,unknown"

  release-evidence-contract:
    name: Reproducible release evidence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install minimum supported Rust toolchain
        # dtolnay/rust-toolchain v1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.85.0"

      - name: Test deterministic release evidence
        run: python3 -m unittest tests/test_release_bundle.py
