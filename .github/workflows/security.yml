---
name: Security and dependency policy

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  dependency-policy:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.FLOW_SUITE_HOSTED_CI == 'enabled') && (github.event_name != 'schedule' || vars.FLOW_SUITE_SCHEDULED_CI == 'enabled')
    name: Licenses, advisories, bans, and sources (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - "Cargo.toml"
          - "fuzz/Cargo.toml"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce Cargo dependency policy
        # EmbarkStudios/cargo-deny-action v2.1.1
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        env:
          # The pinned Alpine image contains this musl toolchain. An explicit
          # override prevents the checkout's floating `stable` channel from
          # selecting an uninstalled toolchain inside the action container.
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          rust-version: "1.85.0"
          command: check advisories bans licenses sources
          arguments: "--all-features"
          manifest-path: "${{ matrix.manifest }}"

  dependency-review:
    name: Pull-request supply-chain review
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.FLOW_SUITE_HOSTED_CI == 'enabled') && (github.event_name != 'schedule' || vars.FLOW_SUITE_SCHEDULED_CI == 'enabled') && (github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Review dependency changes
        # actions/dependency-review-action v4.9.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development

  secret-scan:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.FLOW_SUITE_HOSTED_CI == 'enabled') && (github.event_name != 'schedule' || vars.FLOW_SUITE_SCHEDULED_CI == 'enabled')
    name: Verified and unknown secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out complete comparison history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan changed history for secrets
        # trufflesecurity/trufflehog v3.97.4
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb
        with:
          version: "3.97.4"
          extra_args: "--results=verified,unknown"

  release-evidence-contract:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.FLOW_SUITE_HOSTED_CI == 'enabled') && (github.event_name != 'schedule' || vars.FLOW_SUITE_SCHEDULED_CI == 'enabled')
    name: Reproducible release evidence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install minimum supported Rust toolchain
        # dtolnay/rust-toolchain v1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.85.0"

      - name: Test deterministic release evidence
        run: python3 -m unittest tests/test_release_bundle.py tests/test_read_only_pilot.py
