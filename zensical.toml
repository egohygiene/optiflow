[project]
site_name = "optiflow"
site_url = "https://optiflow.egohygiene.io/docs/"
site_description = "Evidence-first media inventory, exact relationship proof, and review-only optimization planning."
site_author = "Ego Hygiene"
repo_url = "https://github.com/egohygiene/optiflow"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = ".site/staging/docs"
copyright = "Copyright &copy; 2026 Ego Hygiene"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Architecture" = "architecture.md" },
  { "Core concepts" = [
    { "Safety model" = "safety-model.md" },
    { "Artifact-set protocol" = "artifact-set-protocol.md" },
    { "Observation protocol" = "observation-protocol.md" },
    { "State model" = "state-model.md" },
    { "Development model" = "development-model.md" },
  ] },
  { "Contracts" = [
    { "CLI outcomes" = "cli-contract.md" },
    { "Configuration" = "configuration.md" },
    { "JSON artifacts" = "json-contract.md" },
  ] },
  { "Engineering" = [
    { "MVP specification" = "mvp-spec.md" },
    { "Cloud-native placement" = "cloud-native-placement.md" },
    { "Site publication" = "site-publication.md" },
  ] },
  { "Roadmap" = "https://github.com/egohygiene/optiflow/blob/main/ROADMAP.md" },
]

[project.theme]
language = "en"
font = false
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "search.suggest",
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
