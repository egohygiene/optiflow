[package]
name = "optiflow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
tempfile = "3.23"
toml = "1.1"

[dependencies.optiflow]
path = ".."
version = "=0.1.0"

[[bin]]
name = "artifact-set-reader"
path = "fuzz_targets/artifact_set_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config-document"
path = "fuzz_targets/config_document.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
