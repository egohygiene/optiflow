---
version: "3"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  build:
    desc: Build all debug targets.
    cmds:
      - cargo build --all-targets

  build:release:
    desc: Build the optimized release binary.
    cmds:
      - cargo build --release

  check:
    desc: Run fast compiler checks.
    cmds:
      - cargo check --all-targets

  format:
    desc: Format Rust source.
    cmds:
      - cargo fmt --all

  format:check:
    desc: Verify Rust formatting.
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run strict Clippy checks.
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run the complete test suite.
    cmds:
      - cargo test --all-targets

  smoke:
    desc: Run the synthetic read-only end-to-end test.
    cmds:
      - ./scripts/smoke-test.sh

  contracts:
    desc: Verify checked-in JSON Schemas are syntactically valid.
    cmds:
      - |
        for schema in schemas/*.schema.json; do
          jq empty "$schema"
        done

  validate:
    desc: Run all repository validation.
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: contracts
      - task: smoke
