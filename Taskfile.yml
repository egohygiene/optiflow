---
version: "3"

tasks:
  diagnostics:preview:
    desc: Preview generated support categories without creating a bundle
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_SUPPORT_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json diagnostics preview --request "$OPTIFLOW_SUPPORT_REQUEST"

  diagnostics:bundle:
    desc: Explicitly create a fresh private metadata-only support bundle
    requires:
      vars: [REQUEST, OUTPUT]
    env:
      OPTIFLOW_SUPPORT_REQUEST: '{{.REQUEST}}'
      OPTIFLOW_SUPPORT_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - optiflow --json diagnostics bundle --request "$OPTIFLOW_SUPPORT_REQUEST" --output "$OPTIFLOW_SUPPORT_OUTPUT"

  diagnostics:inspect:
    desc: Inspect support structure and digest without extracting or trusting content
    requires:
      vars: [BUNDLE]
    env:
      OPTIFLOW_SUPPORT_BUNDLE: '{{.BUNDLE}}'
    cmds:
      - optiflow --json diagnostics inspect --bundle "$OPTIFLOW_SUPPORT_BUNDLE"

  diagnostics:doctor:
    desc: Describe compiled observability capabilities without discovery or network
    cmds:
      - optiflow --json diagnostics doctor

  release:report:mutation-review:
    desc: Assemble an unsigned native mutation evidence review without executing or publishing
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OPTIFLOW_MUTATION_REVIEW_REQUEST: '{{.REQUEST}}'
      OPTIFLOW_MUTATION_REVIEW_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/owner_reports.py mutation-review --request "$OPTIFLOW_MUTATION_REVIEW_REQUEST" --output-directory "$OPTIFLOW_MUTATION_REVIEW_OUTPUT"

  mp4:capabilities:
    desc: Describe source-only MP4 compatibility and preservation requirements
    cmds:
      - optiflow --json mp4-delivery capabilities

  mp4:handoff:prepare:
    desc: Bind an explicit input reference and consumer policy without encoding
    requires:
      vars: [REQUEST, INPUT_REFERENCE, CONSUMER, UNCHANGED_POLICY]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
      OPTIFLOW_MP4_INPUT: '{{.INPUT_REFERENCE}}'
      OPTIFLOW_MP4_CONSUMER: '{{.CONSUMER}}'
      OPTIFLOW_MP4_UNCHANGED: '{{.UNCHANGED_POLICY}}'
    cmds:
      - >-
        optiflow --json mp4-delivery prepare-handoff
        --request "$OPTIFLOW_MP4_REQUEST" --input-reference "$OPTIFLOW_MP4_INPUT"
        --consumer "$OPTIFLOW_MP4_CONSUMER" --unchanged-policy "$OPTIFLOW_MP4_UNCHANGED"

  mp4:handoff:run:
    desc: Execute a frozen prepared handoff through the existing MP4 owner
    requires:
      vars: [PREPARED]
    env:
      OPTIFLOW_MP4_PREPARED: '{{.PREPARED}}'
    cmds:
      - optiflow --json mp4-delivery run-handoff --request "$OPTIFLOW_MP4_PREPARED"

  mp4:folder:summary:
    desc: Compare retained MP4 outcomes and explain continuation barriers
    requires:
      vars: [RUN_DIRECTORY]
    env:
      OPTIFLOW_MP4_RUN: '{{.RUN_DIRECTORY}}'
    cmds:
      - optiflow --json mp4-delivery folder-summary --run-directory "$OPTIFLOW_MP4_RUN"

  mp4:run:events:
    desc: Run an explicit MP4 request with a new private operational event log
    requires:
      vars: [REQUEST, EVENT_LOG]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
      OPTIFLOW_MP4_EVENTS: '{{.EVENT_LOG}}'
    cmds:
      - optiflow --json mp4-delivery run --request "$OPTIFLOW_MP4_REQUEST" --event-log "$OPTIFLOW_MP4_EVENTS"

  mp4:preflight:
    desc: Observe explicit MP4 prerequisites without provider execution or reservation
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery preflight --request "$OPTIFLOW_MP4_REQUEST"

  mp4:resolve:
    desc: Show effective MP4 settings and provenance without media/tool observation
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery resolve --request "$OPTIFLOW_MP4_REQUEST"

  mp4:folder:resolve:
    desc: Show the resolved frozen folder policy without traversal or providers
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery folder-resolve --request "$OPTIFLOW_MP4_REQUEST"

  mp4:profiles:
    desc: Describe the explicit unqualified MP4 delivery source profile
    cmds:
      - optiflow mp4-delivery profiles

  mp4:plan:
    desc: Inspect an explicit MP4 request and tool pins without invoking providers
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery plan --request "$OPTIFLOW_MP4_REQUEST"

  mp4:run:
    desc: Explicitly produce a private MP4 candidate requiring human quality review
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery run --request "$OPTIFLOW_MP4_REQUEST"

  mp4:folder:preview:
    desc: Discover an explicit MP4 folder without providers or writable workspaces
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery folder-preview --request "$OPTIFLOW_MP4_REQUEST"

  mp4:folder:run:
    desc: Start a fresh serial MP4 run with explicit generated-only scratch cleanup
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery folder-run --request "$OPTIFLOW_MP4_REQUEST"

  mp4:folder:resume:
    desc: Reconcile and continue only never-started MP4 folder work
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_MP4_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow --json mp4-delivery folder-resume --request "$OPTIFLOW_MP4_REQUEST"

  mp4:folder:status:
    desc: Inspect retained MP4 folder results without replay
    requires:
      vars: [RUN_DIRECTORY]
    env:
      OPTIFLOW_MP4_RUN: '{{.RUN_DIRECTORY}}'
    cmds:
      - optiflow --json mp4-delivery folder-status --run-directory "$OPTIFLOW_MP4_RUN"

  video:profiles:
    desc: Describe explicit source-only video candidate profile limits
    cmds:
      - optiflow video-folder profiles

  video:preview:
    desc: Inspect selected video folder without providers or writable workspaces
    requires:
      vars: [REQUEST]
    env:
      OPTIFLOW_VIDEO_PREVIEW_REQUEST: '{{.REQUEST}}'
    cmds:
      - optiflow video-folder preview --request "$OPTIFLOW_VIDEO_PREVIEW_REQUEST"

  default:
    desc: List available tasks.
    cmds:
      - task --list

  build:
    desc: Build all debug targets.
    cmds:
      - cargo build --locked --all-targets

  build:release:
    desc: Build the optimized release binary.
    cmds:
      - cargo build --locked --release

  check:
    desc: Run fast compiler checks.
    cmds:
      - cargo check --locked --all-targets

  format:
    desc: Format Rust source.
    cmds:
      - cargo fmt --all

  format:check:
    desc: Verify Rust formatting.
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run strict Clippy checks.
    cmds:
      - cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    desc: Run the complete test suite.
    cmds:
      - cargo test --locked --all-targets

  test:adversarial:
    desc: Run bounded property and deterministic fault suites with evidence logs.
    cmds:
      - ./scripts/run-adversarial-tests.sh properties faults

  fuzz:bounded:
    desc: Run bounded configuration-parser and artifact-reader fuzz targets.
    cmds:
      - ./scripts/run-adversarial-tests.sh fuzz

  security:dependencies:
    desc: Enforce Cargo license, advisory, ban, and source policy.
    cmds:
      - cargo deny --all-features check advisories bans licenses sources
      - cargo deny --manifest-path fuzz/Cargo.toml --all-features check advisories bans licenses sources

  test:release-evidence:
    desc: Test deterministic release archives, SBOM, provenance, and tamper rejection.
    cmds:
      - python3 -m unittest tests/test_release_bundle.py

  smoke:
    desc: Run the synthetic read-only end-to-end test.
    cmds:
      - ./scripts/smoke-test.sh

  performance:test:
    desc: Test performance sampling and enforcement policy.
    cmds:
      - python3 -m unittest tests/test_performance_baseline.py

  performance:check:
    desc: Enforce the synthetic read-only performance budgets.
    cmds:
      - task: performance:test
      - cargo build --locked --release
      - >-
        python3 scripts/run-performance-baseline.py
        --binary "target/release/optiflow"
        --budgets "performance/budgets-v1.json"
        --output "target/performance-baseline.json"
        --enforce

  contracts:
    desc: Verify schemas and generated extension contract documentation.
    cmds:
      - |
        for schema in schemas/*.schema.json; do
          jq empty "$schema"
        done
      - python3 scripts/generate-extension-docs.py --check
      - |
        generated_manifest="$(mktemp)"
        generated_embedded_manifest="$(mktemp)"
        trap 'rm -f "${generated_manifest}" "${generated_embedded_manifest}"' EXIT
        cargo run --quiet --locked --example process_extension -- --print-manifest > "${generated_manifest}"
        diff --unified examples/extensions/reference-inspector.manifest.json "${generated_manifest}"
        cargo run --quiet --locked --example embedded_roles -- --print-manifest > "${generated_embedded_manifest}"
        diff --unified examples/extensions/reference-embedded-roles.manifest.json "${generated_embedded_manifest}"

  extensions:examples:
    desc: Compile and test extension SDK examples.
    cmds:
      - cargo test --locked --examples

  identity:v1:check:
    desc: Validate OptiFlow's pinned Identity v1 source contract.
    cmds:
      - python3 identity/scripts/validate_identity.py --repository-root . --format json

  identity:v1:generate:
    desc: Generate OptiFlow's selected Identity v1 package from reviewed source.
    cmds:
      - cargo run --quiet --manifest-path identity/Cargo.toml -- v1-generate --repository-root .

  identity:v1:verify:
    desc: Verify OptiFlow's selected Identity v1 package has no missing or drifted files.
    cmds:
      - cargo run --quiet --manifest-path identity/Cargo.toml -- v1-verify --repository-root .

  docs:sync:
    desc: Synchronize the pinned documentation environment.
    cmds:
      - uv sync --frozen --only-group docs

  docs:serve:
    desc: Preview the Zensical documentation site locally.
    deps:
      - docs:sync
    cmds:
      - uv run --frozen --only-group docs zensical serve

  docs:build:
    desc: Build documentation with strict link and reference validation.
    deps:
      - docs:sync
    cmds:
      - uv run --frozen --only-group docs zensical build --clean --strict

  site:build:
    desc: Compose and verify the product, architecture, documentation, and schema surfaces.
    deps:
      - docs:sync
    cmds:
      - ./scripts/site/build.sh

  site:serve:
    desc: Build and preview the complete static site locally.
    deps:
      - site:build
    cmds:
      - python3 -m http.server 8000 --directory dist

  site:verify:
    desc: Verify the composed static site contract.
    cmds:
      - uv run --frozen --only-group docs python scripts/site/verify.py dist

  validate:
    desc: Run all repository validation.
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: contracts
      - task: extensions:examples
      - task: smoke
      - task: performance:check
      - task: site:build

  release:report:publisher:
    desc: Assemble an unsigned publisher report from exact existing release files.
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OWNER_REPORT_REQUEST: '{{.REQUEST}}'
      OWNER_REPORT_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/owner_reports.py publisher --request "$OWNER_REPORT_REQUEST" --output-directory "$OWNER_REPORT_OUTPUT"

  release:report:qualified:
    desc: Assemble an unsigned report from supplied real positive native evidence.
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OWNER_REPORT_REQUEST: '{{.REQUEST}}'
      OWNER_REPORT_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/owner_reports.py qualified --request "$OWNER_REPORT_REQUEST" --output-directory "$OWNER_REPORT_OUTPUT"

  release:cohort:prepare:
    desc: Index exact qualified native archives and compiled descriptor sidecars.
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OPTIFLOW_COHORT_REQUEST: '{{.REQUEST}}'
      OPTIFLOW_COHORT_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/cohort_assets.py --request "$OPTIFLOW_COHORT_REQUEST" --output-directory "$OPTIFLOW_COHORT_OUTPUT"
